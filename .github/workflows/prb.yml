name: PRB

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each template is one row. Add later frameworks here.
        path:
          - angular/starter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24.15+ ships npm 11.12. Older npm fails while resolving this tree.
          node-version: '24'

      - name: Install
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Test
        working-directory: ${{ matrix.path }}
        run: npm test -- --watch=false

      - name: Build
        working-directory: ${{ matrix.path }}
        run: npm run build
