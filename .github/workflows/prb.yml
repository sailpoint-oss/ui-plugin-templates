name: PRB

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each template is one row. Add later frameworks here.
        path:
          - angular/starter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24.15+ ships npm 11.12. Older npm fails while resolving this tree.
          node-version: '24'

      - name: Install
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Test
        working-directory: ${{ matrix.path }}
        run: npm test -- --watch=false

      - name: Build
        working-directory: ${{ matrix.path }}
        run: npm run build

  skill-collisions:
    name: Skill name collisions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a repo-wide skill would overwrite a framework skill
        shell: bash
        run: |
          set -euo pipefail

          # At `sail ui-plugins init`, the repo-wide (framework-agnostic) skills
          # in /.agents/skills/ are merged into the scaffolded project's
          # .agents/skills/ alongside the framework starter's own skills. A skill
          # folder present in BOTH would overwrite on merge, so that combination
          # is forbidden. Two DIFFERENT frameworks may reuse a name — they never
          # scaffold into the same project — so only root-vs-framework counts.

          all="$(mktemp)"
          find . -path '*/.agents/skills/*' -name SKILL.md -not -path './node_modules/*' \
            | grep -E '/\.agents/skills/[^/]+/SKILL\.md$' | sort -u > "$all" || true

          # Repo-wide skill names: ./.agents/skills/<name>/SKILL.md
          root_names="$(mktemp)"
          grep -E '^\./\.agents/skills/[^/]+/SKILL\.md$' "$all" \
            | sed -E 's#^\./\.agents/skills/([^/]+)/SKILL\.md$#\1#' | sort -u > "$root_names" || true

          # Distinct framework skill locations: everything else that has a
          # .agents/skills/ (for example ./angular/starter/.agents/skills/).
          locs="$(mktemp)"
          grep -vE '^\./\.agents/skills/[^/]+/SKILL\.md$' "$all" \
            | sed -E 's#(/\.agents/skills/)[^/]+/SKILL\.md$#\1#' | sort -u > "$locs" || true

          collisions=0
          while IFS= read -r loc; do
            [ -z "$loc" ] && continue
            fw_names="$(mktemp)"
            find "$loc" -mindepth 2 -maxdepth 2 -name SKILL.md 2>/dev/null \
              | sed -E 's#.*/([^/]+)/SKILL\.md$#\1#' | sort -u > "$fw_names"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              echo "::error::Skill '$name' exists in both ./.agents/skills/ (repo-wide) and ${loc#./} (framework). These merge into one .agents/skills/ at \`init\` and would overwrite — rename one."
              collisions=$((collisions + 1))
            done < <(comm -12 "$root_names" "$fw_names")
          done < "$locs"

          if [ "$collisions" -ne 0 ]; then
            echo "Found $collisions repo-wide/framework skill name collision(s)." >&2
            exit 1
          fi
          echo "No repo-wide/framework skill name collisions."
