<div class="shell">
  <div class="shell-body">
    <nav class="shell-sidenav" [attr.aria-label]="'nav.label' | translate">
      <p-menu [model]="navigationItems" [ariaLabel]="'nav.label' | translate" [style]="{ width: '100%' }" />
    </nav>

    <main class="shell-content">
      <header class="shell-content__header">
        <p class="shell-content__title spds-h4">Hello, {{ title() }}</p>
        <div class="shell-content__meta">
          <p-tag [value]="'status.' + status() | translate" [severity]="handshakeSeverity[status()]" />
          @if (context(); as ctx) {
            <span class="shell-content__context"> {{ ctx.tenant.org }} &middot; {{ ctx.user.displayName }} </span>
          }
        </div>
      </header>
      <router-outlet />
    </main>
  </div>
</div>
